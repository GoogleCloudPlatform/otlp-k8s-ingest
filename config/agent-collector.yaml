# Agent-tier configuration, used by the DaemonSet in the agent/gateway topology.
#
# Each node's agent receives OTLP from workloads on that node and forwards it to
# the in-cluster gateway, which is the only tier that talks to Google Cloud.
# Because the agent never exports to Google, it needs no Google credentials and
# no googleclientauth extension.

exporters:
  # Forward to the gateway Service. Plaintext is appropriate here: the hop stays
  # inside the cluster network and never leaves it. The gateway performs the
  # authenticated egress to Google Cloud.
  otlp/gateway:
    endpoint: ${env:GATEWAY_ENDPOINT}
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133

processors:
  batch:
    send_batch_max_size: 200
    send_batch_size: 200
    timeout: 5s

  # passthrough mode is REQUIRED in the agent/gateway topology.
  #
  # In passthrough mode the agent performs no Kubernetes API lookups and adds no
  # metadata; it only stamps the source workload's IP as the k8s.pod.ip resource
  # attribute. The gateway's own k8sattributes processor then keys off that
  # attribute to do the association.
  #
  # Without this, the gateway would associate telemetry using the IP of the TCP
  # connection it received it on -- which is the agent's pod IP -- and every
  # signal in the cluster would be mislabelled as originating from the agent.
  k8sattributes:
    passthrough: true

  memory_limiter:
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
      http:
        cors:
          allowed_origins:
          - http://*
          - https://*
        endpoint: ${env:MY_POD_IP}:4318

service:
  extensions:
  - health_check
  pipelines:
    # memory_limiter is deliberately first in every pipeline so that it can shed
    # load before any other processor does work on the data.
    logs:
      exporters:
      - otlp/gateway
      processors:
      - memory_limiter
      - k8sattributes
      - batch
      receivers:
      - otlp
    metrics:
      exporters:
      - otlp/gateway
      processors:
      - memory_limiter
      - k8sattributes
      - batch
      receivers:
      - otlp
    traces:
      exporters:
      - otlp/gateway
      processors:
      - memory_limiter
      - k8sattributes
      - batch
      receivers:
      - otlp
  telemetry:
    logs:
      encoding: json
