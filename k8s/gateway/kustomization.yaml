# Gateway topology: a per-node agent tier in front of a highly available
# gateway tier. Only the gateway talks to Google Cloud.
#
#   workloads --> agent DaemonSet (node-local) --> gateway --> Google Cloud
#
# This is the OpenTelemetry-recommended production architecture. If you want a
# gateway with no agent tier -- workloads sending OTLP straight to the gateway
# Service -- apply ../base instead; it is the same collector without the
# DaemonSet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Gateway tier: Deployment, Service, RBAC, config, HPA.
  - ../base
  # Agent tier.
  - 1_agent_configmap.yaml
  - 4_agent_daemonset.yaml

patches:
  # Turn the base Deployment into a proper gateway: label it, and raise the HPA
  # floor to 2 since it is the single egress path for every node's telemetry.
  - path: 4_gateway.yaml
