apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../base

patches:
  - target:
      kind: Deployment
      name: opentelemetry-collector
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opentelemetry-collector
  - target:
      kind: HorizontalPodAutoscaler
      name: opentelemetry-collector
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: opentelemetry-collector
