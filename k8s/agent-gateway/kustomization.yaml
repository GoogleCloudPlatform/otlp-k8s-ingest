# Agent/gateway topology: a per-node DaemonSet forwards to a multi-replica
# in-cluster gateway, and only the gateway egresses to Google Cloud.
#
#   workloads --> agent DaemonSet (node-local) --> gateway Deployment --> Google
#
# The gateway is the Deployment, Service, and HPA inherited from ../base, with
# its config unchanged -- the base already IS a gateway, this overlay only makes
# it highly available and puts an agent tier in front of it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - 1_agent_configmap.yaml
  - 4_agent_daemonset.yaml

patches:
  # Raise the gateway's replica floor. The gateway is now the single egress path
  # for every node's telemetry, so a single replica would be a cluster-wide
  # point of failure. `replicas` is deliberately not set on the Deployment --
  # the HPA owns it.
  - target:
      kind: HorizontalPodAutoscaler
      name: opentelemetry-collector
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: opentelemetry-collector
      spec:
        minReplicas: 2
  # Label the gateway tier for clarity. Only the pod template and metadata are
  # touched; the selector is left alone because Deployment selectors are
  # immutable once created.
  - target:
      kind: Deployment
      name: opentelemetry-collector
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opentelemetry-collector
        labels:
          app.kubernetes.io/component: gateway
      spec:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: gateway
