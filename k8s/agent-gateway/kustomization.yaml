# Agent/gateway topology = ../gateway + a per-node agent tier in front of it.
#
#   workloads --> agent DaemonSet (node-local) --> gateway --> Google Cloud
#
# This overlay builds on ../gateway rather than ../base, so the gateway tier is
# defined in exactly one place. Everything below is purely the agent tier; if
# you want to change the gateway, edit ../gateway.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../gateway
  - 1_agent_configmap.yaml
  - 4_agent_daemonset.yaml
